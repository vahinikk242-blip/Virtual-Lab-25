<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assessment · Cheminformatics Virtual Laboratory · SRM Tiruchirappalli</title>
<meta name="description" content="Cheminformatics Virtual Laboratory, Division of Chemistry, SRM Institute of Science and Technology, Tiruchirappalli.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%97%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<nav id="nav"></nav>
<main>

<section>
  <h1>Cheminformatics <span class="grad">Assessment</span></h1>
  <p class="lead" style="margin-top:12px">Answer all twelve questions, then submit to see your score.</p>
  <div id="qs"></div>
  <div id="msg" class="status bad hide"></div>
  <div class="btns"><button class="btn" id="sub">Submit Assessment</button><button class="btn alt" id="reset">Reset</button></div>
  <div id="res" class="glass panel hide" style="margin-top:22px;text-align:center"></div>
</section>

</main>
<footer id="foot"></footer>
<script src="assets/js/chem.js"></script>
<script src="assets/js/site.js"></script>
<script>

const Q=[
["What is the full form of SMILES?",["Simplified Molecular Input Line Entry System","Standard Molecular Information Language Encoding System","Simple Molecular Identification and Labeling System"],0],
["What does a SMILES string represent?",["A molecular structure using text","A spectroscopy technique","A laboratory instrument"],0],
["Which SMILES represents ethanol?",["CCO","c1ccccc1","CC(=O)O"],0],
["Which SMILES represents benzene?",["c1ccccc1","CCO","O=C=O"],0],
["In SMILES, parentheses are mainly used to indicate:",["Branches","Molecular weight","Atom colour"],0],
["Which property is commonly associated with molecular lipophilicity?",["LogP","TPSA","HBD"],0],
["What does TPSA describe?",["Topological Polar Surface Area","Total Pi Surface Area","Thermal Property Surface Analysis"],0],
["What does HBA mean?",["Hydrogen Bond Acceptor","Heavy Bond Atom","Hydrogen Bond Analysis"],0],
["What does HBD mean?",["Hydrogen Bond Donor","Heavy Bond Descriptor","Hydrogen Bond Distance"],0],
["A double bond contains how many pi (π) bonds?",["1","2","0"],0],
["A triple bond contains how many pi (π) bonds?",["2","1","3"],0],
["Which model is useful for visualizing approximate molecular volume?",["Space Filling","Wireframe only","Text SMILES"],0]];
const $=s=>document.querySelector(s);
/* options are shuffled for display; correct answer tracked by text */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function build(){
  $('#res').classList.add('hide');$('#msg').classList.add('hide');
  $('#qs').innerHTML=Q.map((q,i)=>'<div class="glass q"><p>'+(i+1)+'. '+q[0]+'</p>'+shuffle(q[1]).map(o=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+o.replace(/"/g,'&quot;')+'">'+o+'</label>').join('')+'</div>').join('');
}
build();
$('#reset').onclick=build;
$('#sub').onclick=()=>{
  const ans=Q.map((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');return c?c.value:null});
  if(ans.some(a=>a===null)){const m=$('#msg');m.textContent='Please answer all questions before submitting the assessment.';m.classList.remove('hide');return}
  $('#msg').classList.add('hide');let score=0;
  Q.forEach((q,i)=>{const right=q[1][q[2]];
    document.querySelectorAll('input[name=q'+i+']').forEach(r=>{const l=r.parentElement;l.classList.remove('right','wrong');
      if(r.value===right)l.classList.add('right');else if(r.checked)l.classList.add('wrong');r.disabled=true});
    if(ans[i]===right)score++});
  const pct=score/Q.length*100;
  $('#res').innerHTML='<div class="score grad">'+score+' / '+Q.length+'</div><h3>'+pct.toFixed(1)+'%</h3><p class="lead">'+
    (pct>=80?'🎉 Excellent performance!':pct>=50?'👍 Good! Continue practicing.':'📚 Please review the Theory section and try again.')+'</p>';
  $('#res').classList.remove('hide');$('#res').scrollIntoView({behavior:'smooth'});
};

</script>
</body>
</html>
